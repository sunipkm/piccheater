[package]
name = "dacx578"
version = "0.0.1"
edition = "2018"

[dependencies]
bitfield-struct = "0.12"
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { version = "1.0", optional = true }
kmdparse = { workspace = true, optional = true }
defmt = { version = "1.0", optional = true }

[features]
async = ["dep:embedded-hal-async"]
sync = ["dep:embedded-hal"]
kmdparse = ["dep:kmdparse"]
defmt = ["dep:defmt"]
default = ["async", "sync", "kmdparse", "defmt"]