[package]
name = "ina233"
version = "0.0.1"
edition = "2024"
authors = ["Sunip K. Mukherjee <sunipkmukherjee@gmail.com>"]
description = "Driver for the INA233 power monitor IC"
license = "MIT OR Apache-2.0"

[dependencies]
embedded-hal = { version = "1.0", optional = true }
embedded-hal-async = { version = "1.0", optional = true }
bitfield-struct = {version = "0.13"}
defmt = { version = "1.0", optional = true }
uom = { workspace = true, default-features = false, features = [
    "autoconvert",
    "f32",
    "si",
] }

[features]
default = ["sync", "async", "defmt"]
sync = ["dep:embedded-hal"]
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt"]
